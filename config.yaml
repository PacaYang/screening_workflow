task_root: "/shared/B3/IL4_13_all"
script_root: "/home/ubuntu/screening_workflow/scripts"
input:
  smiles: "{task_root}/Input/compounds_smiles.csv"
  sequences: "{task_root}/Input/sequences.csv"
# proteins: optional; if omitted we will derive from sequences.csv via make_input
proteins: ['IL4', 'IL13']
initial:
  methods: ["GraphDTA","HMSA","ColdDTA","DrugLAMP","ConPLex"]  # EviDTI disabled
  out_dir: "initial_screening"
  per_protein_summary: "summary.csv"
  per_protein_selected: "selected.csv"
  n_keep: 3000
fine:
  methods: ["AF3", "Boltz2", "PBSA", "Vina"]
  out_dir: "fine_screening"
  per_protein_summary: "summary.csv"

global_summary: "summary.csv"   # top-level combined summary (optional)
tools:
  make_input:         "/home/ubuntu/screening_workflow/scripts/make_input_csv.py"
  graphdta:           "/home/ubuntu/screening_workflow/algos/GraphDTA/predict.py"
  hmsa:               "/home/ubuntu/screening_workflow/algos/HMSA-DTI/predict_binding.py"
  colddta:            "/home/ubuntu/screening_workflow/algos/coldDTA/predict.py"
  compile:            "/home/ubuntu/screening_workflow/scripts/init_select_top.py"
  write_af3_protein:  "/home/ubuntu/screening_workflow/scripts/gen_af3_json_protein.py"
  write_af3_lig:      "/home/ubuntu/screening_workflow/scripts/gen_af3_json_with_cmpds.py"
  write_boltz2_yaml:  "/home/ubuntu/screening_workflow/scripts/gen_boltz_yaml.py"
  get_af3_scores:     "/home/ubuntu/screening_workflow/scripts/af3_scores.py"
  get_boltz2_scores:  "/home/ubuntu/screening_workflow/scripts/boltz2_scores.py"
  split_csv:          "/home/ubuntu/screening_workflow/scripts/split_csv.py"
  get_vina_scores:    "/home/ubuntu/screening_workflow/scripts/vina_scores.py"
  af3:                "/home/ubuntu/Applications/alphafold3/run_alphafold.py"
  boltz2:             "/home/ubuntu/miniconda3/envs/boltz/bin/boltz"
  vina:               "/home/ubuntu/screening_workflow/scripts/docking.py"
  diffdock:           "/home/ubuntu/Applications/DiffDock/"
  md:                 "/home/ubuntu/screening_workflow/scripts/pbsa/run_pbsa_md.sh"
  pbsa:               "/home/ubuntu/miniconda3/envs/gmxMMPBSA/bin/gmx_MMPBSA"
  gmx:                "/home/ubuntu/Applications/gromacs-2025.3/bin/GMXRC"
  get_pbsa_scores:    "/home/ubuntu/screening_workflow/scripts/pbsa/pbsa_extract_results.sh"
  map_pbsa_smiles:    "/home/ubuntu/screening_workflow/scripts/pbsa/mapping_smiles.py"

  # EviDTI
  evidti_wrapper:         "/home/ubuntu/screening_workflow/scripts/wrappers/run_evidti.py"
  evidti_extract_features: "/home/ubuntu/screening_workflow/scripts/wrappers/extract_evidti_features.py"
  evidti_predict:         "/home/ubuntu/Applications/EviDTI/predict_custom.py"
  evidti_model:           "/home/ubuntu/Applications/EviDTI/runs/drugbank_model/checkpoint.pth"
  evidti_extract_p:       "/home/ubuntu/Applications/EviDTI/extract_p_emb.py"
  evidti_extract_2d:      "/home/ubuntu/Applications/EviDTI/extract_drug_2d_emb.py"
  evidti_extract_3d:      "/home/ubuntu/Applications/EviDTI/extract_drug_3d_emb.py"
  evidti_prepare:         "/home/ubuntu/Applications/EviDTI/prepare_features_custom.py"

  # DrugLAMP
  druglamp_wrapper:       "/home/ubuntu/screening_workflow/scripts/wrappers/run_druglamp.py"
  druglamp_inference:     "/home/ubuntu/Applications/DrugLAMP/inference.py"
  druglamp_checkpoint:    "/home/ubuntu/Applications/DrugLAMP/lightning_logs/version_3/checkpoints/max_val_ausum= 1.84364.ckpt"

  # ConPLex
  conplex_wrapper:        "/home/ubuntu/screening_workflow/scripts/wrappers/run_conplex.py"
  conplex_predict:        "/home/ubuntu/Applications/ConPLex/run_prediction_jobs.py"
  conplex_model:          "/home/ubuntu/Applications/ConPLex/models/ConPLex_v1_BindingDB.pt"

resources:
  default_mem: "16g"
  default_time: "08:00:00"

