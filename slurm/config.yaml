executor: pcluster-slurm
  #cluster-status: "/home/ubuntu/screening_workflow/slurm/status_squeue.sh"
jobs: 500
keep-going: true

  # queue-1-cr-2 Small node; g5.xlarge;   max-count=230;
  #               24G GPU Mem; 4 CPU cores; 16G Mem
  # queue-1-cr-1 Mid node;   g5.4xlarge;  max-count=60;
  #               24G GPU Mem; 16 CPU cores; 64G Mem
  # queue-1-cr-3 Large node; g5.16xlarge; max-count=14;
  #               24G GPU Mem; 64 CPU cores; 256G Mem


# Defaults for rules that omit them (can be overridden per-rule)
default-resources:
  - cpus_per_task=1
  - mem_mb=1600
  - runtime=600
  - slurm_extra="-C 'g5.xlarge'"

set-resources:
  prefold_af3:
    cpus_per_task: 16
    mem_mb: 6400
    slurm_extra: "--exclusive -C 'g5.4xlarge'"

  prefold_boltz2:
    cpus_per_task: 16
    mem_mb: 6400
    slurm_extra: "--exclusive -C 'g5.4xlarge'"

  vina:
    cpus_per_task: 1
    mem_mb: 1000
    runtime: 6000
    slurm_extra: "-C 'g5.xlarge'"

  af3:
    cpus_per_task: 4
    mem_mb: 1500
    runtime: 6000
    slurm_extra: "--exclusive -C 'g5.xlarge'"

  boltz2:
    cpus_per_task: 4
    mem_mb: 1500
    runtime: 6000
    slurm_extra: "--exclusive -C 'g5.xlarge'"

  diffdock:
    cpus_per_task: 4
    mem_mb: 1500
    runtime: 6000
    slurm_extra: "--exclusive -C 'g5.xlarge'"

  md:
    cpus_per_task: 64
    mem_mb: 15000
    runtime: 6000
    slurm_extra: "--exclusive -C 'g5.16xlarge'"

  pbsa:
    cpus_per_task: 2
    mem_mb: 1000
    runtime: 6000
    slurm_extra: "-C 'g5.xlarge'"
